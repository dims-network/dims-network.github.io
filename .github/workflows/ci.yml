name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    uses: dims-network/.github/.github/workflows/reusable-dashboard-ci.yml@main
    with:
      python_paths: "tools"
      # The only JavaScript left here is the front page's own; the docs figures
      # moved to the core with the pages they draw on.
      js_glob: "tools/*.mjs"
      config_path: ""
      check_assets: false

  # The documentation and the tutorial are built from the core repository with
  # MkDocs and published per version, so they cannot drift from the code they
  # describe. Two things here still can: the palette, and the claims the
  # hand-written pages make about a release.
  pinned-to-a-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch the release this site claims to describe
        run: |
          ref=$(python -c "import json;print(json.load(open('tools/SOURCE.json'))['ref'])")
          echo "documenting: $ref"
          git clone -q --depth 1 --branch "$ref" \
            https://github.com/dims-network/dims.git /tmp/dims \
            || { echo "::error::dims has no tag $ref. tools/SOURCE.json must name a release."; exit 1; }

      # One palette. vendor/tokens.css is a copy of the core's, and this is what
      # stops it becoming a second, slightly different one.
      - name: The vendored palette is the core's palette
        run: python tools/sync_tokens.py /tmp/dims --check

      # index.html and setup.html are written here rather than generated, so
      # nothing else connects them to the release. They drifted four releases
      # before anyone outside the project noticed.
      - name: The hand-written pages agree with that release
        run: python tools/check_unpinned_pages.py /tmp/dims

  # The front page renders its diagram and its repository cards from one
  # script. A mismatch between the two lists in it used to throw before the
  # cards were built, so the page showed neither -- silently, because a
  # TypeError in a script tag is not visible on the page.
  front-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save jsdom@26
      - name: The front page renders its repository cards
        run: node tools/check_front_page.mjs index.html
